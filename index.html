  var WEIGHTS = [125,133,141,149,157,165,174,184,197,285];
  var POINTS = {'win-dec':3,'win-maj':4,'win-tech':5,'win-pin':6,'win-ff':6,'loss':0,'no-match':0};
  var OUTCOME_LABELS = {'win-dec':'Won · Decision (3)','win-maj':'Won · Major Dec. (4)','win-tech':'Won · Tech Fall (5)','win-pin':'Won · Fall (6)','win-ff':'Won · Forfeit (6)','loss':'Lost (0)','no-match':'No match (0)'};
  var OUTCOME_ORDER = ['win-dec','win-maj','win-tech','win-pin','win-ff','loss','no-match'];
  var MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  var GH_TOKEN_KEY = 'dualThreatGhToken';
  var LEAGUE_JSON_URL = 'data/league.json';
  var GH_REPO = 'Warrinza/dual-threat';
  var GH_FILE_PATH = 'data/league.json';
  var GH_BRANCH = 'main';

  function ownerById(s, id){ for (var i=0;i<s.owners.length;i++){ if (s.owners[i].id===id) return s.owners[i]; } return null; }
  function ownerStyle(o){ if(!o) return ''; return 'background:'+o.bg+';color:'+o.text+';border:1px solid '+o.border+';'; }
  function findWrestler(s, ownerId, weight, slot){
    for (var i=0;i<s.wrestlers.length;i++){ var w=s.wrestlers[i]; if(w.ownerId===ownerId&&w.weight===weight&&w.slot===slot) return w; }
    return null;
  }
  function activeSlot(s, week, ownerId, weight){
    var lu = s.lineups[week+'_'+ownerId];
    if (lu && lu[weight]) return lu[weight];
    return 'starter';
  }
  function activeWrestler(s, week, ownerId, weight){
    return findWrestler(s, ownerId, weight, activeSlot(s, week, ownerId, weight));
  }
  function resultFor(s, week, ownerId, weight){ return s.results[week+'_'+ownerId+'_'+weight] || null; }
  function pointsFor(s, week, ownerId, weight){ var r=resultFor(s,week,ownerId,weight); return r? (POINTS[r.outcome]||0) : 0; }
  function weekScore(s, week, ownerId){ var t=0; for(var i=0;i<WEIGHTS.length;i++){ t+=pointsFor(s,week,ownerId,WEIGHTS[i]); } return t; }
  function weekHasResults(s, week, ownerId){
    for (var i=0;i<WEIGHTS.length;i++){ if (resultFor(s,week,ownerId,WEIGHTS[i])) return true; }
    return false;
  }
  function weekHasAnyResults(s, week){
    var wk = s.schedule.filter(function(w){ return w.week===week; })[0];
    if (!wk) return false;
    return wk.matchups.some(function(m){ return weekHasResults(s, week, m.a) || weekHasResults(s, week, m.b); });
  }
  function computeStandings(s){
    var table = {};
    s.owners.forEach(function(o){ table[o.id] = {wins:0,losses:0,ties:0,pf:0,pa:0}; });
    s.schedule.forEach(function(wk){
      wk.matchups.forEach(function(m){
        var played = weekHasResults(s, wk.week, m.a) || weekHasResults(s, wk.week, m.b);
        var sa = weekScore(s, wk.week, m.a), sb = weekScore(s, wk.week, m.b);
        table[m.a].pf += sa; table[m.a].pa += sb;
        table[m.b].pf += sb; table[m.b].pa += sa;
        if (played){
          if (sa>sb){ table[m.a].wins++; table[m.b].losses++; }
          else if (sb>sa){ table[m.b].wins++; table[m.a].losses++; }
          else { table[m.a].ties++; table[m.b].ties++; }
        }
      });
    });
    return table;
  }
  function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(name){ return String(name||'?').trim().slice(0,1).toUpperCase(); }
  function outcomeShort(outcome){
    if (!outcome || outcome==='no-match') return '—';
    var map = {'win-dec':'Dec','win-maj':'Maj','win-tech':'TF','win-pin':'Fall','win-ff':'FF','loss':'L'};
    return map[outcome] || outcome;
  }

  function parseWeekRange(label, seasonStartYear){
    // e.g. "Nov 16–22", "Nov 30–Dec 6", "Dec 28–Jan 3"
    var m = String(label||'').match(/^([A-Za-z]+)\s+(\d+)\s*[–-]\s*(?:([A-Za-z]+)\s+)?(\d+)/);
    if (!m) return null;
    var m1 = MONTHS[m[1].toLowerCase().slice(0,3)];
    var d1 = parseInt(m[2],10);
    var m2name = m[3] || m[1];
    var m2 = MONTHS[m2name.toLowerCase().slice(0,3)];
    var d2 = parseInt(m[4],10);
    if (m1==null || m2==null) return null;
    var y1 = seasonStartYear;
    if (m1 <= 6) y1 = seasonStartYear + 1; // Jan–Jun belong to next calendar year
    var y2 = y1;
    if (m2 < m1) y2 = y1 + 1; // crossed year boundary within the range
    else if (m2 <= 6 && m1 > 6) y2 = seasonStartYear + 1;
    return {start:new Date(y1, m1, d1), end:new Date(y2, m2, d2, 23, 59, 59)};
  }

  function seasonStartYearFromLabel(seasonLabel){
    var m = String(seasonLabel||'').match(/(\d{4})/);
    return m ? parseInt(m[1],10) : new Date().getFullYear();
  }

  function detectCurrentWeek(s){
    var year = seasonStartYearFromLabel(s.seasonLabel);
    var now = new Date();
    var i, wk, range;
    for (i=0;i<s.schedule.length;i++){
      wk = s.schedule[i];
      range = parseWeekRange(wk.label, year);
      if (range && now >= range.start && now <= range.end) return wk.week;
    }
    for (i=0;i<s.schedule.length;i++){
      if (!weekHasAnyResults(s, s.schedule[i].week)) return s.schedule[i].week;
    }
    return s.schedule.length ? s.schedule[0].week : 1;

  async function saveToGitHub(newState, token){
    var apiUrl = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE_PATH;
    var headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
    var getRes = await fetch(apiUrl + '?ref=' + encodeURIComponent(GH_BRANCH), { headers: headers });
    if (!getRes.ok) {
      var getErr = await getRes.json().catch(function(){ return {}; });
      throw new Error(getErr.message || ('Could not read league.json (HTTP ' + getRes.status + ')'));
    }
    var meta = await getRes.json();
    var body = JSON.stringify(newState, null, 2) + '\n';
    var putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
      body: JSON.stringify({
        message: 'Update league data',
        content: utf8ToBase64(body),
        sha: meta.sha,
        branch: GH_BRANCH
      })
    });
    if (!putRes.ok) {
      var putErr = await putRes.json().catch(function(){ return {}; });
      throw new Error(putErr.message || ('GitHub save failed (HTTP ' + putRes.status + ')'));
    }
  }

  async function publish(newState){
    if (saving) return;
    saving = true;
    render();
    try {
      var token = getGhToken();
      if (token) {
        await saveToGitHub(newState, token);
        applyState(newState);
        saveMode = 'github';
        showToast('Saved — shared league data updated.');
      } else if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
        var art = await claude.use('artifact');
        if (art) {
          var res = await art.publish(buildFullDocument(newState));
          if (res && res.ok === false){ showToast('Could not save — try again.'); }
          else { applyState(newState); saveMode = 'claude'; showToast('Saved.'); }
        } else {
          showToast('Add a GitHub token in Organizer to save shared data.');
        }
      } else {
        showToast('Add a GitHub token in Organizer to save shared data.');
      }
    } catch(e){
      showToast('Save failed: ' + (e && e.message ? e.message : 'unknown error'));
    }
    saving = false;
    render();
  }

  function renderStandings(){
    var drafted = state.wrestlers.length > 0;
    var anyResults = Object.keys(state.results).length > 0;
    var table = computeStandings(state);
    var rows = state.owners.slice().sort(function(a,b){
      var ta=table[a.id], tb=table[b.id];
      if (tb.wins!==ta.wins) return tb.wins-ta.wins;
      if (ta.losses!==tb.losses) return ta.losses-tb.losses;
      return (tb.pf-tb.pa)-(ta.pf-ta.pa);
    });
    var html = '<div class="card"><h2>Standings</h2><p class="sub">Ranked by head-to-head record, then point differential.</p>';
    if (!drafted) {
      html += '<div class="empty-state"><strong>No wrestlers drafted yet</strong>Standings will appear after the organizer enters rosters and weekly results. Open <em>Organizer</em> to build rosters, or check <em>Matchups</em> once the season starts.</div></div>';
      return html;
    }
    if (!anyResults) {
      html += '<div class="empty-state" style="margin-bottom:16px;"><strong>Season not underway</strong>Rosters are in, but no results have been logged. Records stay 0–0 until matchups are scored.</div>';
    }

    var anyDecided = rows.some(function(o){ var t=table[o.id]; return t.wins||t.losses||t.ties; });
    rows.forEach(function(o,i){
      var t = table[o.id];
      var diff = t.pf-t.pa;
      var medalClass = i===0?' medal-1':i===1?' medal-2':i===2?' medal-3':'';
      var leaderRow = (i===0 && anyDecided) ? ' leader' : '';
      html += '<tr class="'+leaderRow+'"><td><span class="rank'+medalClass+'">'+(i+1)+'</span><span class="owner-chip"><span class="avatar" style="'+ownerStyle(o)+'">'+esc(initials(o.name))+'</span>'+esc(o.name)+'</span></td>'+

    });
    html += '</tbody></table></div></div>';
    return html;
  }

      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;"><button type="button" class="btn ghost" data-action="clear-gh-token">Clear token</button></div>';

      html += '<div class="field"><label>Fine-grained PAT</label><input type="password" id="gh-token-input" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;"><button type="button" class="btn" data-action="save-gh-token">Save token in this browser</button></div>';
    }
    html += '</div>';
    return html;
  }

  function renderAdmin(){
    var html = '<div class="card"><h2>Organizer Tools</h2><p class="sub">'+(canEdit
      ? 'Enter draft rosters, set weekly lineups, and log official results. Saves commit <code>data/league.json</code> so the whole league stays in sync.'
      : 'Paste a GitHub fine-grained PAT below to unlock roster, lineup, and results editors.')+'</p>';
    html += renderAuthPanel();
    if (!canEdit){
      html += '<div class="notice" style="margin-top:16px;">Editors unlock after a token is saved in this browser'+(claudeCanEdit?' (or when Claude artifact edit access is available)':'')+'.</div></div>';
      return html;
    }

    // Roster editor
    html += '<div class="admin-editor"><h3 style="margin:0 0 10px;font-family:\'Big Shoulders Display\',sans-serif;text-transform:uppercase;">Roster Builder</h3>';
    html += '<div class="field-row"><div class="field"><label>Owner</label><select id="roster-owner">'+ownerOptions(adminOwnerId)+'</select></div></div>';
    html += '<div class="admin-grid" id="roster-fields">';
    WEIGHTS.forEach(function(w){
      var starter = findWrestler(state,adminOwnerId,w,'starter') || {name:'',school:''};
      var bench = findWrestler(state,adminOwnerId,w,'bench') || {name:'',school:''};
      html += '<div class="admin-wt-row"><span class="wt-label">'+w+'</span>'+
        '<div class="field"><label>Starter — name / school</label><input type="text" id="st-name-'+w+'" placeholder="Wrestler name" value="'+esc(starter.name)+'" style="margin-bottom:6px;"><input type="text" id="st-school-'+w+'" placeholder="School" value="'+esc(starter.school)+'"></div>'+
        '<div class="field"><label>Bench — name / school</label><input type="text" id="bn-name-'+w+'" placeholder="Wrestler name" value="'+esc(bench.name)+'" style="margin-bottom:6px;"><input type="text" id="bn-school-'+w+'" placeholder="School" value="'+esc(bench.school)+'"></div>'+
        '</div>';
    });
    html += '</div><button class="btn" data-action="save-roster" style="margin-top:12px;" '+(saving?'disabled':'')+'>Save Roster</button></div>';

    // Lineup editor
    html += '<div class="admin-editor"><h3 style="margin:0 0 10px;font-family:\'Big Shoulders Display\',sans-serif;text-transform:uppercase;">Weekly Lineup</h3>';
    html += '<div class="field-row"><div class="field"><label>Week</label><select id="lineup-week">'+weekOptions(adminWeek)+'</select></div><div class="field"><label>Owner</label><select id="lineup-owner">'+ownerOptions(adminOwnerId)+'</select></div></div>';
    html += '<div id="lineup-fields">';
    WEIGHTS.forEach(function(w){
      var starter = findWrestler(state,adminOwnerId,w,'starter');
      var bench = findWrestler(state,adminOwnerId,w,'bench');
      var slot = activeSlot(state, adminWeek, adminOwnerId, w);
      html += '<div class="lineup-row"><span class="wt-label">'+w+'</span>'+
        '<span>'+(starter?esc(starter.name):'<span class="empty-slot">no starter</span>')+(bench?' / bench: '+esc(bench.name):'')+'</span>'+
        '<div class="toggle-group" data-lineup-toggle="'+w+'">'+
          '<button type="button" data-slot="starter" class="'+(slot==='starter'?'active':'')+'" '+(starter?'':'disabled')+'>Starter</button>'+
          '<button type="button" data-slot="bench" class="'+(slot==='bench'?'active':'')+'" '+(bench?'':'disabled')+'>Bench</button>'+
        '</div></div>';
    });
    html += '</div><button class="btn" data-action="save-lineup" style="margin-top:12px;" '+(saving?'disabled':'')+'>Save Lineup</button></div>';

    // Matchup-oriented results editor
    var wk = state.schedule.filter(function(w){ return w.week===adminWeek; })[0] || state.schedule[0];
    if (adminMatchupIdx < 0 || adminMatchupIdx >= wk.matchups.length) adminMatchupIdx = 0;
    var m = wk.matchups[adminMatchupIdx];
    var oa = ownerById(state, m.a), ob = ownerById(state, m.b);

    html += '<div class="admin-editor"><h3 style="margin:0 0 10px;font-family:\'Big Shoulders Display\',sans-serif;text-transform:uppercase;">Enter Results by Matchup</h3>';
    html += '<div class="cheat-sheet" aria-label="Scoring cheat sheet">';
    html += '<span>Dec 3</span><span>Major 4</span><span>Tech 5</span><span>Fall 6</span><span>Forfeit 6</span><span>Loss 0</span>';
    html += '</div>';
    html += '<div class="field-row"><div class="field"><label>Week</label><select id="results-week">'+weekOptions(adminWeek)+'</select></div>';
    html += '<div class="field"><label>Matchup</label><select id="results-matchup">';
    wk.matchups.forEach(function(mu, idx){
      var a = ownerById(state, mu.a), b = ownerById(state, mu.b);
      html += '<option value="'+idx+'"'+(idx===adminMatchupIdx?' selected':'')+'>'+esc(a.name)+' vs '+esc(b.name)+'</option>';
    });
    html += '</select></div></div>';

    html += '<p class="sub" style="margin-bottom:10px;"><span class="owner-chip"><span class="avatar" style="'+ownerStyle(oa)+'">'+esc(initials(oa.name))+'</span>'+esc(oa.name)+'</span> &nbsp;vs&nbsp; <span class="owner-chip"><span class="avatar" style="'+ownerStyle(ob)+'">'+esc(initials(ob.name))+'</span>'+esc(ob.name)+'</span></p>';

    html += '<div id="results-fields">';
    html += '<div class="matchup-result-row" style="border-bottom:2px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;"><span></span><span>'+esc(oa.name)+'</span><span>Outcome</span><span>'+esc(ob.name)+'</span><span>Outcome</span></div>';
    WEIGHTS.forEach(function(w){
      var activeA = activeWrestler(state, adminWeek, m.a, w);
      var activeB = activeWrestler(state, adminWeek, m.b, w);
      var curA = resultFor(state, adminWeek, m.a, w);
      var curB = resultFor(state, adminWeek, m.b, w);
      html += '<div class="matchup-result-row">'+
        '<span class="wt-label">'+w+'</span>'+
        '<span class="side-a-name who">'+(activeA?esc(activeA.name)+' <span style="color:var(--muted)">('+activeSlot(state,adminWeek,m.a,w)+')</span>':'<span class="empty-slot">no active</span>')+'</span>'+
        '<select class="side-a-sel" id="res-a-'+w+'" data-side="a" data-wt="'+w+'">'+outcomeOptions(curA)+'</select>'+
        '<span class="side-b-name who">'+(activeB?esc(activeB.name)+' <span style="color:var(--muted)">('+activeSlot(state,adminWeek,m.b,w)+')</span>':'<span class="empty-slot">no active</span>')+'</span>'+
        '<select class="side-b-sel" id="res-b-'+w+'" data-side="b" data-wt="'+w+'">'+outcomeOptions(curB)+'</select>'+
        '</div>';
    });
    html += '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center;">';
    html += '<button class="btn" data-action="save-matchup-results" '+(saving?'disabled':'')+'>Save Matchup Results</button>';
    html += '<span class="sub" style="margin:0;">Running total preview: <strong id="preview-a">'+weekScore(state,adminWeek,m.a).toFixed(0)+'</strong> – <strong id="preview-b">'+weekScore(state,adminWeek,m.b).toFixed(0)+'</strong></span>';
    html += '</div></div>';

    html += '</div>';
    return html;
  }

  // ---------- events ----------
  function wireEvents(){
    root.querySelectorAll('[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){ tab = btn.getAttribute('data-tab'); saveUIPrefs(); render(); });
    });
    root.querySelectorAll('[data-week-view]').forEach(function(btn){
      btn.addEventListener('click', function(){ viewWeek = parseInt(btn.getAttribute('data-week-view'),10); saveUIPrefs(); render(); });
    });
    root.querySelectorAll('[data-open-matchup]').forEach(function(btn){
      btn.addEventListener('click', function(){
        detailMatchup = {
          week: parseInt(btn.getAttribute('data-open-matchup'),10),
          a: btn.getAttribute('data-a'),
          b: btn.getAttribute('data-b')
        };
        render();
      });
    });
    var backdrop = root.querySelector('[data-modal-backdrop]');
    if (backdrop) {
      backdrop.addEventListener('click', function(e){
        if (e.target === backdrop) closeDetail();
      });
      var closeBtn = backdrop.querySelector('[data-close-modal]');
      if (closeBtn) closeBtn.addEventListener('click', closeDetail);
      var dialog = backdrop.querySelector('.modal');
      if (dialog) {
        var focusable = dialog.querySelector('[data-close-modal]');
        if (focusable) focusable.focus();
      }
    }

    var rosterFilter = root.querySelector('#roster-filter');
    if (rosterFilter) rosterFilter.addEventListener('change', function(){ rosterOwnerId = rosterFilter.value; saveUIPrefs(); render(); });

    var saveTokenBtn = root.querySelector('[data-action="save-gh-token"]');
    if (saveTokenBtn) saveTokenBtn.addEventListener('click', function(){
      var input = root.querySelector('#gh-token-input');
      var val = input ? String(input.value || '').trim() : '';
      if (!val) { showToast('Paste a fine-grained PAT first.'); return; }
      if (!setGhToken(val)) { showToast('Could not store token in this browser.'); return; }
      refreshCanEdit();
      saveMode = getGhToken() ? 'github' : saveMode;
      showToast('Token saved in this browser only.');
      render();
    });
    var clearTokenBtn = root.querySelector('[data-action="clear-gh-token"]');
    if (clearTokenBtn) clearTokenBtn.addEventListener('click', function(){
      setGhToken('');
      refreshCanEdit();
      if (!canEdit && tab === 'admin') { /* stay on admin for re-auth */ }
      saveMode = getGhToken() ? 'github' : (claudeCanEdit ? 'claude' : 'none');
      showToast('Token cleared from this browser.');
      render();
    });

    var rOwner = root.querySelector('#roster-owner');
    if (rOwner) rOwner.addEventListener('change', function(){ adminOwnerId = rOwner.value; saveUIPrefs(); render(); });
    var lWeek = root.querySelector('#lineup-week');
    if (lWeek) lWeek.addEventListener('change', function(){ adminWeek = parseInt(lWeek.value,10); saveUIPrefs(); render(); });
    var lOwner = root.querySelector('#lineup-owner');
    if (lOwner) lOwner.addEventListener('change', function(){ adminOwnerId = lOwner.value; saveUIPrefs(); render(); });
    var resWeek = root.querySelector('#results-week');
    if (resWeek) resWeek.addEventListener('change', function(){ adminWeek = parseInt(resWeek.value,10); adminMatchupIdx = 0; saveUIPrefs(); render(); });
    var resMatchup = root.querySelector('#results-matchup');
    if (resMatchup) resMatchup.addEventListener('change', function(){ adminMatchupIdx = parseInt(resMatchup.value,10); saveUIPrefs(); render(); });

    root.querySelectorAll('[data-lineup-toggle]').forEach(function(grp){
      grp.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          if (b.disabled) return;
          grp.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
          grp.setAttribute('data-chosen', b.getAttribute('data-slot'));
        });
      });
    });

    // Live preview totals for matchup results
    function updatePreview(){
      var pa = 0, pb = 0;
      WEIGHTS.forEach(function(w){
        var sa = root.querySelector('#res-a-'+w);
        var sb = root.querySelector('#res-b-'+w);
        if (sa) pa += POINTS[sa.value] || 0;
        if (sb) pb += POINTS[sb.value] || 0;
      });
      var ea = root.querySelector('#preview-a');
      var eb = root.querySelector('#preview-b');
      if (ea) ea.textContent = String(pa);
      if (eb) eb.textContent = String(pb);
    }
    root.querySelectorAll('#results-fields select').forEach(function(sel){
      sel.addEventListener('change', updatePreview);
    });

    var saveRoster = root.querySelector('[data-action="save-roster"]');
    if (saveRoster) saveRoster.addEventListener('click', function(){
      var ns = cloneState();
      var ownerId = root.querySelector('#roster-owner').value;
      ns.wrestlers = ns.wrestlers.filter(function(w){ return w.ownerId!==ownerId; });
      WEIGHTS.forEach(function(w){
        var sn = root.querySelector('#st-name-'+w).value.trim();
        var ss = root.querySelector('#st-school-'+w).value.trim();
        var bn = root.querySelector('#bn-name-'+w).value.trim();
        var bs = root.querySelector('#bn-school-'+w).value.trim();
        if (sn) ns.wrestlers.push({ownerId:ownerId,weight:w,slot:'starter',name:sn,school:ss});
        if (bn) ns.wrestlers.push({ownerId:ownerId,weight:w,slot:'bench',name:bn,school:bs});
      });
      adminOwnerId = ownerId;
      saveUIPrefs();
      publish(ns);
    });

    var saveLineup = root.querySelector('[data-action="save-lineup"]');
    if (saveLineup) saveLineup.addEventListener('click', function(){
      var ns = cloneState();
      var week = parseInt(root.querySelector('#lineup-week').value,10);
      var ownerId = root.querySelector('#lineup-owner').value;
      var key = week+'_'+ownerId;
      var choices = {};
      root.querySelectorAll('[data-lineup-toggle]').forEach(function(grp){
        var w = parseInt(grp.getAttribute('data-lineup-toggle'),10);
        var chosen = grp.getAttribute('data-chosen') || (grp.querySelector('button.active')&&grp.querySelector('button.active').getAttribute('data-slot')) || 'starter';
        choices[w] = chosen;
      });
      ns.lineups[key] = choices;
      adminWeek = week; adminOwnerId = ownerId;
      saveUIPrefs();
      publish(ns);
    });

    var saveMatchupResults = root.querySelector('[data-action="save-matchup-results"]');
    if (saveMatchupResults) saveMatchupResults.addEventListener('click', function(){
      var ns = cloneState();
      var week = parseInt(root.querySelector('#results-week').value,10);
      var idx = parseInt(root.querySelector('#results-matchup').value,10);
      var weekObj = ns.schedule.filter(function(w){ return w.week===week; })[0];
      if (!weekObj || !weekObj.matchups[idx]) return;
      var mu = weekObj.matchups[idx];
      WEIGHTS.forEach(function(w){
        var valA = root.querySelector('#res-a-'+w).value;
        var valB = root.querySelector('#res-b-'+w).value;
        var keyA = week+'_'+mu.a+'_'+w;
        var keyB = week+'_'+mu.b+'_'+w;
        if (valA==='no-match') delete ns.results[keyA];
        else ns.results[keyA] = {outcome:valA};
        if (valB==='no-match') delete ns.results[keyB];
        else ns.results[keyB] = {outcome:valB};
      });
      adminWeek = week; adminMatchupIdx = idx;
      saveUIPrefs();
      publish(ns);
    });
  }

  // Global Escape to close modal
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && detailMatchup) {
      e.preventDefault();
      closeDetail();
    }
  });

  // ---------- boot ----------
  injectStyle();
  (async function(){
    try {
      var res = await fetch(LEAGUE_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) {
        var data = await res.json();
        if (data && data.owners && data.schedule) {
          applyState(data);
        } else {
          loadNotice = 'Shared league file looked incomplete — showing built-in defaults.';
        }
      } else {
        loadNotice = 'Could not load shared league data (HTTP ' + res.status + ') — showing built-in defaults.';
      }
    } catch (e) {
      loadNotice = 'Could not load shared league data — showing built-in defaults. Serve the repo folder (or GitHub Pages) so data/league.json is reachable.';
    }

    try {
      if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
        var userCap = await claude.use('user');
        claudeCanEdit = !!(userCap && await userCap.canEdit());
      }
    } catch (e) {
      claudeCanEdit = false;
    }
    refreshCanEdit();
    saveMode = getGhToken() ? 'github' : (claudeCanEdit ? 'claude' : 'none');
    render();
  })();
}
